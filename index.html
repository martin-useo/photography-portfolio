    <script>
    // Fonction de chargement direct des images display pour la page d'accueil
    function loadThumbnailForCanvas(img) {
      if (!img.dataset.filename) return;
      if (img.dataset.loaded === 'true') return;
      
      const filename = img.dataset.filename;
      const basePath = '';
      
      const ext = filename.match(/\.[^.]+$/)?.[0] || '.jpg';
      const baseName = filename.replace(ext, '');
      
      // WebP uniquement (support 97%+ navigateurs)
      const displayUrl = `${basePath}assets/images-optimized/${baseName}-display.webp`;
      
      const displayImg = new Image();
      displayImg.onload = () => {
        img.src = displayUrl;
        img.style.opacity = '1';
        img.dataset.loaded = 'true';
      };
      
      displayImg.onerror = () => {
        console.error('[IndexCanvas] Image failed to load:', filename);
        img.style.opacity = '0';
      };
      
      displayImg.src = displayUrl;
    }
    </script>
    <script>
    // Layouts prédéfinis pour la disposition des images
    const MOBILE_LAYOUTS = [
      {
        name: 'mobile-single-portrait',
        description: 'Un unique portrait',
        structure: [
          { width: 'w-full', height: 'h-full', isPortrait: true }
        ],
        isMobile: true
      },
      {
        name: 'mobile-double-landscape',
        description: 'Deux paysages superposés',
        structure: [
          { width: 'w-full', height: 'h-1/2', isLandscape: true },
          { width: 'w-full', height: 'h-1/2', isLandscape: true }
        ],
        isMobile: true
      }
    ];

    const DESKTOP_LAYOUTS = [
      {
        name: 'two-left-one-right',
        description: 'Deux images à gauche, une grande à droite',
        structure: [
          { width: 'md:w-1/2', height: 'h-1/2', isLeftColumn: true },
          { width: 'md:w-1/2', height: 'h-1/2', isLeftColumn: true },
          { width: 'md:w-1/2', height: 'h-full', isRightColumn: true }
        ],
        useColumns: true
      },
      {
        name: 'three-column-grid',
        description: 'Trois images en colonnes égales',
        structure: [
          { width: 'md:w-1/3', height: 'h-full' },
          { width: 'md:w-1/3', height: 'h-full' },
          { width: 'md:w-1/3', height: 'h-full' }
        ]
      }
    ];

    function preloadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error(`Failed to load image: ${src}`));
        img.src = src;
      });
    }

    function isMobile() {
      return window.innerWidth < 768;
    }

    function getRandomLayout() {
      if (isMobile()) {
        return MOBILE_LAYOUTS[Math.floor(Math.random() * MOBILE_LAYOUTS.length)];
      } else {
        return DESKTOP_LAYOUTS[Math.floor(Math.random() * DESKTOP_LAYOUTS.length)];
      }
    }

    function organizeImagesForLayout(layout) {
      const organized = [];
      const usedImages = new Set();
      
      if (layout.name === 'mobile-single-portrait') {
        if (!cachedPortraitImages || cachedPortraitImages.length < 1) {
          console.warn('Pas assez d\'images portrait disponibles pour mobile-single-portrait');
          return [];
        }
        
        const shuffledPortraits = [...cachedPortraitImages].sort(() => Math.random() - 0.5);
        const selectedImage = shuffledPortraits[0];
        organized.push({
          ...selectedImage,
          layoutCell: layout.structure[0]
        });
      } else if (layout.name === 'mobile-double-landscape') {
        if (!cachedLandscapeImages || cachedLandscapeImages.length < 2) {
          console.warn('Pas assez d\'images paysage disponibles pour mobile-double-landscape');
          return [];
        }
        
        const shuffledLandscapes = [...cachedLandscapeImages].sort(() => Math.random() - 0.5);
        layout.structure.forEach((cell, index) => {
          if (index < shuffledLandscapes.length) {
            const selectedImage = shuffledLandscapes[index];
            organized.push({
              ...selectedImage,
              layoutCell: cell
            });
          }
        });
      } else if (layout.name === 'three-column-grid') {
        if (!cachedPortraitImages || cachedPortraitImages.length < 3) {
          console.warn('Pas assez d\'images portrait disponibles pour three-column-grid');
          return [];
        }
        
        const shuffledPortraits = [...cachedPortraitImages].sort(() => Math.random() - 0.5);
      let portraitIndex = 0;
        
        layout.structure.forEach((cell, index) => {
          while (portraitIndex < shuffledPortraits.length && usedImages.has(shuffledPortraits[portraitIndex].src)) {
            portraitIndex++;
          }
          
          if (portraitIndex < shuffledPortraits.length) {
            const selectedImage = shuffledPortraits[portraitIndex];
            usedImages.add(selectedImage.src);
            organized.push({
              ...selectedImage,
              layoutCell: cell
            });
            portraitIndex++;
          }
        });
      } else if (layout.name === 'two-left-one-right') {
        if (!cachedLandscapeImages || cachedLandscapeImages.length < 2) {
          console.warn('Pas assez d\'images paysage disponibles pour two-left-one-right (gauche)');
          return [];
        }
        if (!cachedPortraitImages || cachedPortraitImages.length < 1) {
          console.warn('Pas assez d\'images portrait disponibles pour two-left-one-right (droite)');
          return [];
        }
        
        const shuffledLandscapes = [...cachedLandscapeImages].sort(() => Math.random() - 0.5);
        const shuffledPortraits = [...cachedPortraitImages].sort(() => Math.random() - 0.5);
        
      let landscapeIndex = 0;
        let portraitIndex = 0;
      
      layout.structure.forEach((cell, index) => {
        let selectedImage;
        
          if (index < 2) {
            while (landscapeIndex < shuffledLandscapes.length && usedImages.has(shuffledLandscapes[landscapeIndex].src)) {
              landscapeIndex++;
            }
            if (landscapeIndex < shuffledLandscapes.length) {
              selectedImage = shuffledLandscapes[landscapeIndex];
              landscapeIndex++;
            }
          } else {
            while (portraitIndex < shuffledPortraits.length && usedImages.has(shuffledPortraits[portraitIndex].src)) {
              portraitIndex++;
            }
            if (portraitIndex < shuffledPortraits.length) {
              selectedImage = shuffledPortraits[portraitIndex];
              portraitIndex++;
            }
          }
          
          if (selectedImage && !usedImages.has(selectedImage.src)) {
            usedImages.add(selectedImage.src);
          organized.push({
            ...selectedImage,
            layoutCell: cell
          });
        }
      });
      }
      
      return organized;
    }

    let cachedImages = null;
    let cachedPortraitImages = null;
    let cachedLandscapeImages = null;
    let currentLayout = null;
    let currentImageIndices = [];
    let cycleInterval = null;
    let lastChangedCell = -1;
    let isCurrentlyMobile = null;
    
    function createLayoutStructure(layout, organizedImages) {
      const grid = document.getElementById('portfolio-grid');
      if (!grid) return;
      
      grid.innerHTML = '';
      
      if (layout.isMobile) {
        grid.className = 'flex flex-col w-full h-full';
        
        organizedImages.forEach((img, index) => {
          if (!img || !img.layoutCell) return;
          
          const cellContainer = document.createElement('div');
          cellContainer.className = `${img.layoutCell.width} ${img.layoutCell.height} relative overflow-hidden`;
          cellContainer.dataset.cellIndex = index;
          
          const imageStack = document.createElement('div');
          imageStack.className = 'absolute inset-0';
          
          const imgElement = document.createElement('img');
          imgElement.dataset.src = img.src;
          imgElement.dataset.filename = img.filename || img.src.split('/').pop();
          imgElement.alt = img.alt || 'Portfolio image';
          imgElement.className = 'block h-full w-full object-cover object-center opacity-0 transition-opacity duration-700 ease-in-out';
          imgElement.dataset.imageIndex = index;
          imageStack.appendChild(imgElement);
          
          loadThumbnailForCanvas(imgElement);
          
          cellContainer.appendChild(imageStack);
          grid.appendChild(cellContainer);
        });
      } else if (layout.useColumns) {
        grid.className = 'flex w-full h-full';
        
        let leftWidth, rightWidth;
        if (layout.name === 'two-left-one-right') {
          leftWidth = 'md:w-1/2';
          rightWidth = 'md:w-1/2';
        } else {
          leftWidth = 'md:w-1/3';
          rightWidth = 'md:w-2/3';
        }
        
        const leftColumn = document.createElement('div');
        leftColumn.className = `flex flex-col ${leftWidth} w-full h-full`;
        
        const rightColumn = document.createElement('div');
        rightColumn.className = `flex flex-col ${rightWidth} w-full h-full`;
        
        organizedImages.forEach((img, index) => {
          if (!img || !img.layoutCell) return;
          
          const cellContainer = document.createElement('div');
          cellContainer.className = `w-full ${img.layoutCell.height} relative overflow-hidden`;
          cellContainer.dataset.cellIndex = index;
          
          const imageStack = document.createElement('div');
          imageStack.className = 'absolute inset-0';
          
          const imgElement = document.createElement('img');
          imgElement.dataset.src = img.src;
          imgElement.dataset.filename = img.filename || img.src.split('/').pop();
          imgElement.alt = img.alt || 'Portfolio image';
          imgElement.className = 'block h-full w-full object-cover object-center opacity-0 transition-opacity duration-700 ease-in-out';
          imgElement.dataset.imageIndex = index;
          imageStack.appendChild(imgElement);
          
          loadThumbnailForCanvas(imgElement);
          
          cellContainer.appendChild(imageStack);
          
          if (img.layoutCell.isLeftColumn) {
            leftColumn.appendChild(cellContainer);
          } else if (img.layoutCell.isRightColumn) {
            rightColumn.appendChild(cellContainer);
          }
        });
        
        grid.appendChild(leftColumn);
        grid.appendChild(rightColumn);
      } else {
        grid.className = 'flex flex-wrap w-full h-full items-stretch';
        
        const hasPartialHeights = organizedImages.some(img => 
          img.layoutCell.height && (img.layoutCell.height.includes('1/3') || img.layoutCell.height.includes('2/3'))
        );
        
        if (hasPartialHeights) {
          grid.style.display = 'flex';
          grid.style.flexWrap = 'wrap';
          grid.style.height = '100%';
        }
        
        organizedImages.forEach((img, index) => {
          if (!img || !img.layoutCell) return;
          
          const cellContainer = document.createElement('div');
          cellContainer.className = `w-full ${img.layoutCell.width} relative overflow-hidden`;
          
          if (img.layoutCell.height) {
            if (img.layoutCell.height === 'h-full') {
              cellContainer.style.height = '100%';
            } else if (img.layoutCell.height === 'h-1/2') {
              cellContainer.style.height = '50%';
            } else if (img.layoutCell.height === 'h-1/3') {
              cellContainer.style.height = '33.333333%';
            } else if (img.layoutCell.height === 'h-2/3') {
              cellContainer.style.height = '66.666667%';
            }
          }
          
          cellContainer.dataset.cellIndex = index;
          
          const imageStack = document.createElement('div');
          imageStack.className = 'absolute inset-0';
          
          const imgElement = document.createElement('img');
          imgElement.dataset.src = img.src;
          imgElement.dataset.filename = img.filename || img.src.split('/').pop();
          imgElement.alt = img.alt || 'Portfolio image';
          imgElement.className = 'block h-full w-full object-cover object-center opacity-0 transition-opacity duration-700 ease-in-out';
          imgElement.dataset.imageIndex = index;
          imageStack.appendChild(imgElement);
          
          loadThumbnailForCanvas(imgElement);
          
          cellContainer.appendChild(imageStack);
          grid.appendChild(cellContainer);
        });
      }
    }
    
    function changeImageInCell(cellIndex, newImage) {
      const grid = document.getElementById('portfolio-grid');
      if (!grid) return;
      
      const cellContainer = grid.querySelector(`[data-cell-index="${cellIndex}"]`);
      if (!cellContainer) return;
      
      const imageStack = cellContainer.querySelector('div');
      if (!imageStack) return;
      
      const oldImg = imageStack.querySelector('img:not(:last-child)');
      
      const newImgElement = document.createElement('img');
      newImgElement.dataset.src = newImage.src;
      newImgElement.dataset.filename = newImage.filename || newImage.src.split('/').pop();
      newImgElement.alt = newImage.alt || 'Portfolio image';
      newImgElement.className = 'block h-full w-full object-cover object-center opacity-0 transition-opacity duration-700 ease-in-out absolute inset-0';
      newImgElement.dataset.imageIndex = cellIndex;
      
      imageStack.appendChild(newImgElement);
      
      // Charger thumbnail directement
      loadThumbnailForCanvas(newImgElement);
      
      // Crossfade avec l'ancienne image
      if (oldImg) {
        oldImg.style.transition = 'opacity 700ms ease-in-out';
        oldImg.style.opacity = '0';
        
        setTimeout(() => {
          oldImg.remove();
        }, 700);
      }
    }
    
    async function renderBackgroundCanvas(useTransition = false) {
      try {
        const grid = document.getElementById('portfolio-grid');
        if (!grid) {
          console.error('Portfolio grid element not found');
          return;
        }
        
        if (typeof IMAGES_CONFIG === 'undefined') {
          console.error('IMAGES_CONFIG is not defined. Make sure dist/images-config.js is loaded.');
          return;
        }
        
        if (!cachedImages) {
          cachedImages = IMAGES_CONFIG.getAllImages('./');
          
          if (!cachedImages || cachedImages.length === 0) {
            console.error('No images found in configuration');
            return;
          }
          
          cachedPortraitImages = cachedImages.filter(img => {
            const ar = img.aspectRatio;
            if (!ar || ar === undefined) {
              return false;
            }
            return ar < 1;
          });
          cachedLandscapeImages = cachedImages.filter(img => {
            const ar = img.aspectRatio;
            if (!ar || ar === undefined) {
              return false;
            }
            return ar > 1;
          });
        }
        
        if (useTransition) {
          grid.style.opacity = '0';
          grid.style.transition = 'opacity 0.5s ease-in-out';
          await new Promise(resolve => setTimeout(resolve, 500));
        }
        
        grid.innerHTML = '';
        
        const selectedLayout = getRandomLayout();
        const organizedImages = organizeImagesForLayout(selectedLayout);
        
        if (!organizedImages || organizedImages.length === 0) {
          console.error('No images organized for layout');
          return;
        }
        
        currentLayout = selectedLayout;
        isCurrentlyMobile = isMobile();
        currentImageIndices = organizedImages.map((img, idx) => 
          cachedImages.findIndex(ai => ai.src === img.src)
        );
        
        lastChangedCell = -1;
        createLayoutStructure(selectedLayout, organizedImages);
      } catch (error) {
        console.error('Error rendering background canvas:', error);
        const grid = document.getElementById('portfolio-grid');
        if (grid) {
          grid.innerHTML = '<div class="w-full h-full bg-gray-800 flex items-center justify-center text-white">Erreur de chargement des images</div>';
        }
      }
    }
    
    function cycleNextImage() {
      if (!currentLayout || !cachedImages || currentImageIndices.length === 0) {
        return;
      }
      
      let availableCells = [];
      for (let i = 0; i < currentImageIndices.length; i++) {
        if (i !== lastChangedCell) {
          availableCells.push(i);
        }
      }
      
      if (availableCells.length === 0) {
        availableCells = [0];
      }
      
      const cellIndex = availableCells[Math.floor(Math.random() * availableCells.length)];
      const currentImageIndex = currentImageIndices[cellIndex];
      
      const usedImageIndices = new Set(currentImageIndices);
      let newImage;
      let newImageIndex;
      let attempts = 0;
      const maxAttempts = 200;
      
      let poolToUse;
      if (currentLayout.name === 'mobile-single-portrait') {
        poolToUse = cachedPortraitImages;
      } else if (currentLayout.name === 'mobile-double-landscape') {
        poolToUse = cachedLandscapeImages;
      } else if (currentLayout.name === 'three-column-grid') {
        poolToUse = cachedPortraitImages;
      } else if (currentLayout.name === 'two-left-one-right') {
        if (cellIndex < 2) {
          poolToUse = cachedLandscapeImages;
        } else {
          poolToUse = cachedPortraitImages;
        }
      } else {
        poolToUse = cachedImages;
      }
      
      if (!poolToUse || poolToUse.length === 0) {
        console.warn('Pool d\'images vide pour le cycle');
        return;
      }
      
      const shuffledPool = [...poolToUse].sort(() => Math.random() - 0.5);
      
      do {
        newImage = shuffledPool[attempts % shuffledPool.length];
        newImageIndex = cachedImages.findIndex(img => img.src === newImage.src);
        attempts++;
      } while ((newImageIndex === currentImageIndex || newImageIndex === -1 || usedImageIndices.has(newImageIndex)) && attempts < maxAttempts);
      
      if (attempts >= maxAttempts || newImageIndex === -1) {
        newImage = shuffledPool[0];
        newImageIndex = cachedImages.findIndex(img => img.src === newImage.src);
        if (newImageIndex === -1) {
          console.warn('Impossible de trouver l\'index de la nouvelle image');
          return;
        }
      }
      
      currentImageIndices[cellIndex] = newImageIndex;
      lastChangedCell = cellIndex;
      
      changeImageInCell(cellIndex, newImage);
    }
    
    function startProgressiveCycle() {
      if (cycleInterval) {
        clearInterval(cycleInterval);
      }
      
      cycleInterval = setInterval(() => {
        cycleNextImage();
      }, 2500);
    }
    
    function startAutoCycle() {
      startProgressiveCycle();
    }
    
    let currentLanguage = 'fr';
    let languageInterval = null;
    
    function cycleLanguage() {
      const buttonTextFr = document.getElementById('button-text-fr');
      const buttonTextEn = document.getElementById('button-text-en');
      
      if (!buttonTextFr || !buttonTextEn) return;
      
      if (currentLanguage === 'fr') {
        requestAnimationFrame(() => {
          buttonTextEn.style.opacity = '1';
          setTimeout(() => {
            requestAnimationFrame(() => {
              buttonTextFr.style.opacity = '0';
            });
          }, 150);
        });
        currentLanguage = 'en';
      } else {
        requestAnimationFrame(() => {
          buttonTextFr.style.opacity = '1';
          setTimeout(() => {
            requestAnimationFrame(() => {
              buttonTextEn.style.opacity = '0';
            });
          }, 150);
        });
        currentLanguage = 'fr';
      }
    }
    
    function startLanguageCycle() {
      if (languageInterval) {
        clearInterval(languageInterval);
      }
      
      const initialDelay = 3000 + Math.random() * 4000;
      
      setTimeout(() => {
        cycleLanguage();
        languageInterval = setInterval(() => {
          cycleLanguage();
        }, 4700);
      }, initialDelay);
    }
    
    let resizeTimeout;
    function handleResize() {
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(() => {
        const newIsMobile = isMobile();
        if (isCurrentlyMobile !== null && newIsMobile !== isCurrentlyMobile) {
          isCurrentlyMobile = newIsMobile;
          renderBackgroundCanvas(true);
        }
      }, 250);
    }

    window.addEventListener('resize', handleResize);

    document.addEventListener('DOMContentLoaded', function() {
      if (typeof IMAGES_CONFIG === 'undefined') {
        console.error('IMAGES_CONFIG is not defined. Make sure dist/images-config.js is loaded.');
        const script = document.createElement('script');
        script.src = 'dist/images-config.js';
        script.onload = function() {
          renderBackgroundCanvas().then(() => {
            startAutoCycle();
            startLanguageCycle();
          });
        };
        script.onerror = function() {
          console.error('Failed to load images-config.js');
        };
        document.head.appendChild(script);
      } else {
        renderBackgroundCanvas().then(() => {
          startAutoCycle();
          startLanguageCycle();
        });
      }
    });
  </script>
  <script src="js/components/loader.js"></script>
