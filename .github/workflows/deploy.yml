name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate optimized thumbnails
        run: npm run generate:thumbs

      - name: Verify thumbnails generated
        run: |
          echo "Checking if thumbnails were generated..."
          ls -la assets/images-optimized/ || echo "Directory not found!"
      
      - name: Prepare for deployment
        run: |
          touch .nojekyll
          echo "Created .nojekyll to disable Jekyll"
          
      - name: Create config.js with secrets
        run: |
          cat > config/emailjs.config.js << 'EOF'
          const CONFIG = {
            emailjs: {
              publicKey: "${{ secrets.EMAILJS_PUBLIC_KEY }}",
              serviceId: "${{ secrets.EMAILJS_SERVICE_ID }}",
              templateId: "${{ secrets.EMAILJS_TEMPLATE_ID }}"
            }
          };
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
