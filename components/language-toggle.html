<button 
  class="language-toggle-button px-2 py-1 md:px-3 md:py-1.5 text-xs md:text-sm font-signika font-medium bg-white border border-black text-black rounded transition-all duration-300 hover:scale-105 hover:shadow-md min-w-[2rem] md:min-w-[2.5rem]"
  onclick="if(typeof LanguageManager !== 'undefined') { LanguageManager.toggleLanguage(); }"
  aria-label="Toggle language">
  <span class="language-toggle-text inline-block transition-opacity duration-300 w-5 md:w-6 text-center">FR</span>
</button>

<script>
  (function() {
    const button = document.querySelector('.language-toggle-button:not([data-initialized])');
    if (!button) return;
    button.setAttribute('data-initialized', 'true');
    
    function updateToggleText() {
      const toggleText = button.querySelector('.language-toggle-text');
      if (toggleText && typeof LanguageManager !== 'undefined' && LanguageManager.currentLang) {
        const expectedText = LanguageManager.currentLang.toUpperCase();
        // Ne mettre à jour que si le texte est différent pour éviter les boucles
        if (toggleText.textContent !== expectedText) {
          toggleText.textContent = expectedText;
        }
      }
    }
    
    // Écouter les changements de langue (important pour les mises à jour dynamiques)
    window.addEventListener('languageChanged', function() {
      updateToggleText();
    });
    
    // Fonction pour initialiser le texte du bouton
    function initLanguageToggle() {
      updateToggleText();
      // Forcer une mise à jour après un court délai pour être sûr
      setTimeout(updateToggleText, 50);
      setTimeout(updateToggleText, 150);
    }
    
    // Initialiser immédiatement si LanguageManager est déjà disponible
    if (typeof LanguageManager !== 'undefined' && LanguageManager.currentLang) {
      initLanguageToggle();
    } else {
      // Sinon, attendre que LanguageManager soit disponible
      let attempts = 0;
      const maxAttempts = 40;
      
      const checkLanguageManager = setInterval(() => {
        attempts++;
        if (typeof LanguageManager !== 'undefined' && LanguageManager.currentLang) {
          clearInterval(checkLanguageManager);
          initLanguageToggle();
        } else if (attempts >= maxAttempts) {
          clearInterval(checkLanguageManager);
          setTimeout(() => {
            if (typeof LanguageManager !== 'undefined' && LanguageManager.currentLang) {
              initLanguageToggle();
            }
          }, 500);
        }
      }, 50);
    }
  })();
</script>
