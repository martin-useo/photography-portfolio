<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Martin USEO - Portfolio Showcase</title>
  <meta name="description"
    content="Discover the photography portfolio of Martin USEO – a freelance photographer based in Paris, France." />
  <link rel="icon" type="image/x-icon" href="../assets/favicon.ico" />
  <link rel="stylesheet" href="../css/output.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Signika:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      content: ["../**/*.{html,js}"],
      theme: {
        extend: {
          fontFamily: {
            'signika': ['Signika', 'sans-serif'],
          },
        },
      },
      plugins: [],
    }
  </script>
  <script>
    document.write('<style id="i18n-preload">body{visibility:hidden}</style>');
  </script>
  <script src="../js/i18n.js"></script>
  <script>
    if (typeof applyTranslationsBeforeRender === 'function') {
      applyTranslationsBeforeRender();
    }
    
    function revealBody() {
      const style = document.getElementById('i18n-preload');
      if (style) style.remove();
      if (document.body) document.body.style.visibility = '';
    }
    
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function() {
        if (typeof LanguageManager !== 'undefined') {
          LanguageManager.applyLanguage();
        }
        revealBody();
      });
    } else {
      if (typeof LanguageManager !== 'undefined') {
        LanguageManager.applyLanguage();
      }
      revealBody();
    }
  </script>
  <script src="../js/components/loader.js"></script>
  <script src="../js/components/dropdown.js"></script>
  <style>
    /* Fix pour Safari iOS - garantit que les gaps fonctionnent avec support responsive */
    #categories-grid {
      display: -webkit-grid;
      display: grid;
      -webkit-grid-template-columns: repeat(2, 1fr);
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
      -webkit-column-gap: 1rem;
      -moz-column-gap: 1rem;
      column-gap: 1rem;
      row-gap: 1rem;
      -webkit-row-gap: 1rem;
      width: 100%;
    }
    @media (min-width: 640px) {
      #categories-grid {
        -webkit-grid-template-columns: repeat(3, 1fr);
        grid-template-columns: repeat(3, 1fr);
        gap: 2rem;
        -webkit-column-gap: 2rem;
        -moz-column-gap: 2rem;
        column-gap: 2rem;
        row-gap: 2rem;
        -webkit-row-gap: 2rem;
      }
    }
    /* Fix pour Safari iOS - garantir que l'aspect ratio fonctionne correctement */
    @supports (-webkit-touch-callout: none) {
      @media (max-width: 639px) {
        #categories-grid > a {
          /* Forcer l'aspect ratio 3:2 sur iOS */
          aspect-ratio: 3 / 2 !important;
          -webkit-aspect-ratio: 3 / 2;
          /* S'assurer que la largeur est respectée */
          width: 100% !important;
          /* Empêcher toute contrainte de hauteur */
          max-height: none !important;
          min-height: 0 !important;
        }
      }
    }
  </style>
</head>

<body
  class="dark:bg-black bg-white h-screen text-black dark:text-white px-5 md:px-20 opacity-0 animate-fade-in transition duration-500">
  <!-- Navbar -->
  <div id="navbar-container" data-path="../components/navbar.html"></div>
  
  <!-- Content -->
  <div class="container mx-auto max-w-7xl">
    <!-- Hero Image -->
    <div class="pt-10 md:pt-20 pb-8 md:pb-16 relative" id="hero-section">
      <div id="hero-container" class="w-full md:aspect-[3/2] rounded-lg overflow-hidden">
        <img id="hero-image" src="" data-i18n-alt="showcase.heroAlt" alt="Vitrine du portfolio" class="w-full h-full object-cover" />
        <div id="hero-three-portraits" class="hidden md:flex w-full h-full gap-0"></div>
      </div>
      <!-- Scroll indicator -->
      <div id="scroll-indicator" class="absolute bottom-4 left-1/2 transform -translate-x-1/2 animate-bounce hidden md:block opacity-100 transition-opacity duration-500">
        <svg class="w-6 h-6 text-black dark:text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="filter: drop-shadow(0 2px 8px rgba(255,255,255,0.8)) drop-shadow(0 2px 4px rgba(0,0,0,0.3));">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3" />
        </svg>
      </div>
    </div>

    <!-- Categories Grid -->
    <div class="pb-20 pt-8 md:pt-0" style="position: relative; z-index: 1;">
      <h2 class="text-3xl md:text-4xl font-signika font-bold mb-6 md:mb-12 text-center" data-i18n="showcase.title">Découvrir les catégories</h2>
      <div id="categories-grid" style="position: relative; z-index: 1;"></div>
      <div class="hidden sm:flex justify-center mt-4 md:mt-8">
        <div id="categories-grid-last-row" class="grid grid-cols-2" style="gap: 2rem; -webkit-column-gap: 2rem; -moz-column-gap: 2rem; row-gap: 2rem; -webkit-row-gap: 2rem; width: calc((100% - 2rem) * 2 / 3 + 2rem); max-width: calc((100% - 4rem) * 2 / 3 + 4rem);"></div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div id="footer-container" data-path="../components/footer.html"></div>
  <!-- Scroll to Top Button -->
  <div id="scroll-to-top-container" data-path="../components/scroll-to-top.html"></div>

  <script src="../js/image-protection.js"></script>
  <script src="../js/utils/webp-support.js"></script>
  <script src="../js/images-config.js"></script>
  <script src="../js/optimization/image-optimizer.js"></script>
  <script>
    const categories = [
      { nameKey: 'sport', slug: 'sport', path: 'portfolio/sport.html' },
      { nameKey: 'evenements', slug: 'evenements', path: 'portfolio/evenements.html' },
      { nameKey: 'animaux', slug: 'animaux', path: 'portfolio/animaux.html' },
      { nameKey: 'portraits', slug: 'portraits', path: 'portfolio/portraits.html' },
      { nameKey: 'urban', slug: 'urban', path: 'portfolio/urban.html' },
      { nameKey: 'nature', slug: 'nature', path: 'portfolio/nature.html' },
      { nameKey: 'vehicules', slug: 'vehicules', path: 'portfolio/vehicules.html' },
      { nameKey: 'divers', slug: 'divers', path: 'portfolio/divers.html' }
    ];

    function getCategoryImage(categorySlug) {
      const basePath = '../';
      let images = [];
      
      switch(categorySlug) {
        case 'nature':
          images = IMAGES_CONFIG.getNatureImages(basePath);
          break;
        case 'portraits':
          images = IMAGES_CONFIG.getPortraitImages(basePath);
          break;
        case 'sport':
          images = IMAGES_CONFIG.getSportImages(basePath);
          break;
        case 'evenements':
          images = IMAGES_CONFIG.getEvenementsImages(basePath);
          break;
        case 'animaux':
          images = IMAGES_CONFIG.getAnimauxImages(basePath);
          break;
        case 'divers':
          images = IMAGES_CONFIG.getDiversImages(basePath);
          break;
        case 'urban':
          images = IMAGES_CONFIG.getUrbanImages(basePath);
          break;
        case 'vehicules':
          images = IMAGES_CONFIG.getVehiculesImages(basePath);
          break;
        default:
          images = IMAGES_CONFIG.getAllImages(basePath);
      }
      
      if (images.length > 0) {
        const fiveStarImages = images.filter(img => img.rating === 5);
        if (fiveStarImages.length > 0) {
          return fiveStarImages[Math.floor(Math.random() * fiveStarImages.length)];
        }
        return images[Math.floor(Math.random() * images.length)];
      }
      return null;
    }

    function getHeroImages() {
      const isDesktop = window.innerWidth >= 768;
      let allImages = IMAGES_CONFIG.getShowcaseImages('../');
      
      if (isDesktop) {
        // Sur desktop, on peut choisir entre une image paysage ou 3 portraits
        const landscapeImages = allImages.filter(img => img.aspectRatio && img.aspectRatio > 1);
        const portraitImages = allImages.filter(img => img.aspectRatio && img.aspectRatio <= 1);
        
        // Choisir aléatoirement entre paysage unique ou 3 portraits
        const useThreePortraits = Math.random() < 0.5 && portraitImages.length >= 3;
        
        if (useThreePortraits) {
          // Prioriser les 5 étoiles
          const fiveStarPortraits = portraitImages.filter(img => img.rating === 5);
          const sourcePortraits = fiveStarPortraits.length >= 3 ? fiveStarPortraits : portraitImages;
          
          // Sélectionner 3 portraits différents
          const shuffled = [...sourcePortraits].sort(() => Math.random() - 0.5);
          const selected = shuffled.slice(0, 3);
          
          if (selected.length === 3) {
            return { type: 'three-portraits', images: selected };
          }
        }
        
        // Sinon, utiliser une image paysage
        if (landscapeImages.length > 0) {
          const fiveStarLandscapes = landscapeImages.filter(img => img.rating === 5);
          const sourceLandscapes = fiveStarLandscapes.length > 0 ? fiveStarLandscapes : landscapeImages;
          return { 
            type: 'single-landscape', 
            images: [sourceLandscapes[Math.floor(Math.random() * sourceLandscapes.length)]]
          };
        }
      }
      
      // Sur mobile, toutes les images sont possibles
      if (allImages.length > 0) {
        const fiveStarImages = allImages.filter(img => img.rating === 5);
        const sourceImages = fiveStarImages.length > 0 ? fiveStarImages : allImages;
        return { 
          type: 'single', 
          images: [sourceImages[Math.floor(Math.random() * sourceImages.length)]]
        };
      }
      
      return null;
    }

    let heroImages = null;

    function adjustHeroImageAspectRatio() {
      if (!heroImages) return;
      
      const heroImgElement = document.getElementById('hero-image');
      const heroThreePortraits = document.getElementById('hero-three-portraits');
      const heroContainer = document.getElementById('hero-container');
      
      if (!heroContainer) return;
      
      // Sur mobile, ajuster le conteneur pour respecter l'aspect ratio naturel de l'image
      if (window.innerWidth < 768 && heroImages.type === 'single' && heroImages.images[0]?.aspectRatio) {
        heroContainer.style.aspectRatio = `${heroImages.images[0].aspectRatio}`;
        if (heroImgElement) {
          heroImgElement.style.objectFit = 'contain';
        }
      } else {
        heroContainer.style.aspectRatio = '';
        if (heroImgElement) {
          heroImgElement.style.objectFit = 'cover';
        }
      }
    }

    function renderShowcase() {
      heroImages = getHeroImages();
      if (!heroImages) return;
      
      const heroImgElement = document.getElementById('hero-image');
      const heroThreePortraits = document.getElementById('hero-three-portraits');
      const heroContainer = document.getElementById('hero-container');
      
      if (!heroContainer) return;
      
      const isDesktop = window.innerWidth >= 768;
      
      if (heroImages.type === 'three-portraits' && isDesktop) {
        // Afficher 3 portraits côte à côte
        if (heroImgElement) {
          heroImgElement.style.display = 'none';
        }
        if (heroThreePortraits) {
          heroThreePortraits.classList.remove('hidden');
          heroThreePortraits.innerHTML = '';
          
          heroImages.images.forEach((img, index) => {
            const portraitDiv = document.createElement('div');
            portraitDiv.className = 'w-1/3 h-full relative overflow-hidden';
            
            const portraitImg = document.createElement('img');
            portraitImg.src = img.src;
            portraitImg.alt = img.alt || LanguageManager.get('showcase.heroAlt');
            portraitImg.className = 'w-full h-full object-cover';
            
            portraitDiv.appendChild(portraitImg);
            heroThreePortraits.appendChild(portraitDiv);
          });
        }
      } else {
        // Afficher une image unique
        if (heroThreePortraits) {
          heroThreePortraits.classList.add('hidden');
        }
        if (heroImgElement && heroImages.images[0]) {
          heroImgElement.style.display = 'block';
          heroImgElement.src = heroImages.images[0].src;
          heroImgElement.alt = heroImages.images[0].alt || LanguageManager.get('showcase.heroAlt');
        }
        
        // Ajuster l'aspect ratio selon la taille de l'écran
        adjustHeroImageAspectRatio();
      }

      const grid = document.getElementById('categories-grid');
      const lastRowGrid = document.getElementById('categories-grid-last-row');
      
      if (!grid) {
        console.error('categories-grid element not found');
        return;
      }
      
      grid.innerHTML = '';
      if (lastRowGrid) {
        lastRowGrid.innerHTML = '';
      }
      
      // Forcer l'affichage de la grille sur iOS
      grid.style.display = '-webkit-grid';
      grid.style.display = 'grid';

      function createCategoryCard(category) {
        const categoryImage = getCategoryImage(category.slug);
        const categoryName = LanguageManager.get(category.nameKey);
        
        const card = document.createElement('a');
        card.href = category.path;
        card.className = 'group relative block overflow-hidden rounded-lg aspect-[3/2] sm:aspect-[4/3] transition-transform duration-300 hover:scale-105 w-full';
        card.setAttribute('data-category', category.slug);
        
        if (categoryImage) {
          card.innerHTML = `
            <div class="absolute inset-0">
              <img data-src="${categoryImage.src}" 
                   data-filename="${categoryImage.filename || categoryImage.src.split('/').pop()}"
                   alt="${categoryImage.alt || categoryName}" 
                   class="w-full h-full object-cover lazy-load opacity-0 transition-opacity duration-500" />
              <div class="absolute inset-0 bg-black/40 group-hover:bg-black/50 transition-colors duration-300"></div>
            </div>
            <div class="absolute inset-0 flex items-center justify-center px-2" style="display: flex; align-items: center; justify-content: center; padding-left: 0.5rem; padding-right: 0.5rem;">
              <h3 class="text-base sm:text-xl md:text-2xl lg:text-3xl xl:text-4xl font-signika font-bold text-white drop-shadow-lg" style="text-align: center; width: 100%;" data-i18n="${category.nameKey}">
                ${categoryName}
              </h3>
            </div>
          `;
          
          const img = card.querySelector('img');
          if (img && typeof ImageOptimizer !== 'undefined') {
            ImageOptimizer.loadImage(img);
          } else if (img) {
            img.src = img.dataset.src;
            img.style.opacity = '1';
          }
        } else {
          card.innerHTML = `
            <div class="absolute inset-0 bg-gradient-to-br from-gray-800 to-gray-900 group-hover:from-gray-700 group-hover:to-gray-800 transition-colors duration-300"></div>
            <div class="absolute inset-0 flex items-center justify-center px-2" style="display: flex; align-items: center; justify-content: center; padding-left: 0.5rem; padding-right: 0.5rem;">
              <h3 class="text-base sm:text-xl md:text-2xl lg:text-3xl xl:text-4xl font-signika font-bold text-white" style="text-align: center; width: 100%;" data-i18n="${category.nameKey}">
                ${categoryName}
              </h3>
            </div>
          `;
        }
        
        return card;
      }

      // Détection mobile améliorée pour iOS
      const isMobile = window.innerWidth < 640 || /iPhone|iPad|iPod/.test(navigator.userAgent);
      
      categories.forEach((category, index) => {
        const card = createCategoryCard(category);
        
        if (isMobile) {
          if (grid) {
            grid.appendChild(card);
            // Forcer la visibilité sur iOS sans affecter l'aspect ratio
            card.style.visibility = 'visible';
            card.style.opacity = '1';
          }
        } else {
          if (index < 6) {
            if (grid) {
              grid.appendChild(card);
            }
          } else {
            if (lastRowGrid) {
              lastRowGrid.appendChild(card);
            }
          }
        }
      });
      
      // Vérification pour Safari iOS - forcer l'affichage si nécessaire
      setTimeout(() => {
        if (grid && grid.children.length === 0) {
          console.warn('Aucun bouton de catégorie créé, réessai...');
          categories.forEach((category, index) => {
            const card = createCategoryCard(category);
            const isMobileCheck = window.innerWidth < 640 || /iPhone|iPad|iPod/.test(navigator.userAgent);
            if (isMobileCheck && grid) {
              grid.appendChild(card);
              card.style.visibility = 'visible';
              card.style.opacity = '1';
            }
          });
        }
      }, 200);
    }

    window.addEventListener('languageChanged', () => {
      if (heroImages && heroImages.images[0]) {
        const heroImgElement = document.getElementById('hero-image');
        if (heroImgElement) {
          heroImgElement.alt = heroImages.images[0].alt || LanguageManager.get('showcase.heroAlt');
        }
      }
    });

    // Gérer le redimensionnement de la fenêtre
    let resizeTimeout;
    let lastWindowWidth = window.innerWidth;
    window.addEventListener('resize', function() {
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(function() {
        const currentWidth = window.innerWidth;
        const wasDesktop = lastWindowWidth >= 768;
        const isNowDesktop = currentWidth >= 768;
        
        // Re-rendre le showcase si on passe de mobile à desktop ou vice versa
        if (wasDesktop !== isNowDesktop) {
          renderShowcase();
        } else {
          adjustHeroImageAspectRatio();
        }
        
        lastWindowWidth = currentWidth;
      }, 100);
    });

    document.addEventListener('DOMContentLoaded', function() {
      renderShowcase();
      
      // Centrer la page sur l'image hero si on vient de index.html ou si le hash est présent
      const shouldScrollToHero = document.referrer.includes('index.html') || window.location.hash === '#hero';
      
      if (shouldScrollToHero) {
        setTimeout(() => {
          const heroSection = document.getElementById('hero-section');
          if (heroSection) {
            heroSection.scrollIntoView({ behavior: 'smooth', block: 'center' });
            // Retirer le hash de l'URL après le scroll
            if (window.location.hash === '#hero') {
              history.replaceState(null, '', window.location.pathname);
            }
          }
        }, 300);
      }
      
      // Faire disparaître l'indicateur de scroll après quelques secondes
      setTimeout(() => {
        const scrollIndicator = document.getElementById('scroll-indicator');
        if (scrollIndicator) {
          scrollIndicator.style.opacity = '0';
          setTimeout(() => {
            scrollIndicator.style.display = 'none';
          }, 500);
        }
      }, 5000);
    });
  </script>

  <script src="../js/fade_in.js"></script>
  <script src="../js/menu.js"></script>
  <script src="../js/scroll-to-top.js"></script>
</body>

</html>
