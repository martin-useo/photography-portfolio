<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Martin USEO - Portfolio Showcase</title>
  <meta name="description"
    content="Discover the photography portfolio of Martin USEO – a freelance photographer based in Paris, France." />
  <link rel="icon" type="image/x-icon" href="../assets/favicon.ico" />
  <link rel="stylesheet" href="../css/output.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Signika:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      content: ["../**/*.{html,js}"],
      theme: {
        extend: {
          fontFamily: {
            'signika': ['Signika', 'sans-serif'],
          },
        },
      },
      plugins: [],
    }
  </script>
  <script>
    document.write('<style id="i18n-preload">body{visibility:hidden}</style>');
  </script>
  <script src="../js/core/i18n.js"></script>
  <script>
    if (typeof applyTranslationsBeforeRender === 'function') {
      applyTranslationsBeforeRender();
    }
    
    function revealBody() {
      const style = document.getElementById('i18n-preload');
      if (style) style.remove();
      if (document.body) document.body.style.visibility = '';
    }
    
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function() {
        if (typeof LanguageManager !== 'undefined') {
          LanguageManager.applyLanguage();
        }
        revealBody();
      });
    } else {
      if (typeof LanguageManager !== 'undefined') {
        LanguageManager.applyLanguage();
      }
      revealBody();
    }
  </script>
  <script src="../js/components/loader.js"></script>
  <script src="../js/components/dropdown.js"></script>
  <link rel="stylesheet" href="../css/components/categories-mobile.css" />
  <link rel="stylesheet" href="../css/components/categories-desktop.css" />
  <link rel="stylesheet" href="../css/vendor/ios-fixes.css" />
  <style>
    #categories-grid {
      display: -webkit-grid;
      display: grid;
      width: 100%;
    }
    
    @media (max-width: 767px) {
      #categories-grid {
        grid-template-columns: repeat(2, 1fr) !important;
        -webkit-grid-template-columns: repeat(2, 1fr) !important;
      }
    }
  </style>
</head>

<body
  class="dark:bg-black bg-white h-screen text-black dark:text-white px-5 md:px-20 opacity-0 animate-fade-in transition duration-500">
  <div id="navbar-container" data-path="../components/navbar.html"></div>
  
  <div class="container mx-auto max-w-7xl">
    <div class="pt-10 md:pt-20 pb-8 md:pb-16 relative" id="hero-section">
      <div id="hero-container" class="w-full md:aspect-[3/2] rounded-lg overflow-hidden">
        <img id="hero-image" src="" data-i18n-alt="showcase.heroAlt" alt="Vitrine du portfolio" class="w-full h-full object-cover" />
        <div id="hero-three-portraits" class="hidden md:flex w-full h-full gap-0" style="position: relative;"></div>
      </div>
      <div id="scroll-indicator" class="absolute bottom-4 left-1/2 transform -translate-x-1/2 animate-bounce hidden md:block opacity-100 transition-opacity duration-500">
        <svg class="w-6 h-6 text-black dark:text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="filter: drop-shadow(0 2px 8px rgba(255,255,255,0.8)) drop-shadow(0 2px 4px rgba(0,0,0,0.3));">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3" />
        </svg>
      </div>
    </div>

    <div class="pb-20 pt-8 md:pt-0" style="position: relative; z-index: 1;">
      <h2 class="text-3xl md:text-4xl font-signika font-bold mb-6 md:mb-12 text-center" data-i18n="showcase.title">Découvrir les catégories</h2>
      <div id="categories-grid" style="position: relative; z-index: 1;"></div>
      <div class="hidden sm:flex justify-center mt-4 md:mt-8">
        <div id="categories-grid-last-row" class="grid grid-cols-2" style="gap: 2rem; -webkit-column-gap: 2rem; -moz-column-gap: 2rem; row-gap: 2rem; -webkit-row-gap: 2rem; width: calc((100% - 2rem) * 2 / 3 + 2rem); max-width: calc((100% - 4rem) * 2 / 3 + 4rem);"></div>
      </div>
    </div>
  </div>

  <div id="footer-container" data-path="../components/footer.html"></div>
  <div id="scroll-to-top-container" data-path="../components/scroll-to-top.html"></div>

  <script src="../js/image-protection.js"></script>
  <script src="../js/core/utils/webp-support.js"></script>
  <script src="../js/core/images-config.js"></script>
  <script src="../js/optimization/image-optimizer.js"></script>
  <script type="module">
    import('../js/responsive/breakpoints-global.js').then(() => {
      return new Promise(resolve => setTimeout(resolve, 50));
    }).then(() => {
      return import('../js/pages/home/hero-handler.js');
    }).then((heroModule) => {
      window.getHeroImages = heroModule.getHeroImages;
      window.renderHero = heroModule.renderHero;
      window.adjustHeroImageAspectRatio = heroModule.adjustHeroImageAspectRatio;
      window.stopPortraitAnimation = heroModule.stopPortraitAnimation;
      return import('../js/pages/home/categories-handler.js');
    }).then((categoriesModule) => {
      window.renderCategories = categoriesModule.renderCategories;
      window.homeModulesLoaded = true;
      if (window.onHomeModulesLoaded) {
        window.onHomeModulesLoaded();
      }
    }).catch((error) => {
      window.homeModulesLoaded = false;
      if (window.onHomeModulesLoaded) {
        window.onHomeModulesLoaded();
      }
    });
  </script>
  <script>
    const categories = [
      { nameKey: 'sport', slug: 'sport', path: 'portfolio/sport.html' },
      { nameKey: 'evenements', slug: 'evenements', path: 'portfolio/evenements.html' },
      { nameKey: 'animaux', slug: 'animaux', path: 'portfolio/animaux.html' },
      { nameKey: 'portraits', slug: 'portraits', path: 'portfolio/portraits.html' },
      { nameKey: 'urban', slug: 'urban', path: 'portfolio/urban.html' },
      { nameKey: 'nature', slug: 'nature', path: 'portfolio/nature.html' },
      { nameKey: 'vehicules', slug: 'vehicules', path: 'portfolio/vehicules.html' },
      { nameKey: 'divers', slug: 'divers', path: 'portfolio/divers.html' }
    ];

    function getCategoryImage(categorySlug) {
      const basePath = '../';
      let images = [];
      
      switch(categorySlug) {
        case 'nature':
          images = IMAGES_CONFIG.getNatureImages(basePath);
          break;
        case 'portraits':
          images = IMAGES_CONFIG.getPortraitImages(basePath);
          break;
        case 'sport':
          images = IMAGES_CONFIG.getSportImages(basePath);
          break;
        case 'evenements':
          images = IMAGES_CONFIG.getEvenementsImages(basePath);
          break;
        case 'animaux':
          images = IMAGES_CONFIG.getAnimauxImages(basePath);
          break;
        case 'divers':
          images = IMAGES_CONFIG.getDiversImages(basePath);
          break;
        case 'urban':
          images = IMAGES_CONFIG.getUrbanImages(basePath);
          break;
        case 'vehicules':
          images = IMAGES_CONFIG.getVehiculesImages(basePath);
          break;
        default:
          images = IMAGES_CONFIG.getAllImages(basePath);
      }
      
      if (images.length > 0) {
        const fiveStarImages = images.filter(img => img.rating === 5);
        if (fiveStarImages.length > 0) {
          return fiveStarImages[Math.floor(Math.random() * fiveStarImages.length)];
        }
        return images[Math.floor(Math.random() * images.length)];
      }
      return null;
    }

    let heroImages = null;

    function renderShowcase() {
      if (typeof IMAGES_CONFIG === 'undefined') return;
      
      const allImages = IMAGES_CONFIG.getShowcaseImages('../');
      if (!allImages || allImages.length === 0) return;
      
      if (!window.getHeroImages) return;
      
      heroImages = window.getHeroImages(allImages);
      if (!heroImages) return;
      
      if (!window.renderHero) return;
      window.renderHero(heroImages);

      if (!window.renderCategories) return;
      window.renderCategories(categories, getCategoryImage);
    }

    window.addEventListener('languageChanged', () => {
      if (heroImages && heroImages.images[0]) {
        const heroImgElement = document.getElementById('hero-image');
        if (heroImgElement) {
          heroImgElement.alt = heroImages.images[0].alt || LanguageManager.get('showcase.heroAlt');
        }
      }
    });

    let resizeTimeout;
    let lastWindowWidth = window.innerWidth;
    window.addEventListener('resize', function() {
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(function() {
        const currentWidth = window.innerWidth;
        const wasDesktop = window.isDesktop ? window.isDesktop() : lastWindowWidth >= 768;
        const isNowDesktop = window.isDesktop ? window.isDesktop() : currentWidth >= 768;
        
        if (wasDesktop !== isNowDesktop) {
          if (window.stopPortraitAnimation) window.stopPortraitAnimation();
          renderShowcase();
        } else {
          if (window.adjustHeroImageAspectRatio) window.adjustHeroImageAspectRatio(heroImages);
        }
        lastWindowWidth = currentWidth;
      }, 100);
    });

    function waitForHomeModules() {
      return new Promise((resolve) => {
        if (window.homeModulesLoaded && window.getHeroImages && window.renderHero && window.renderCategories) {
          resolve();
        } else {
          window.onHomeModulesLoaded = resolve;
          setTimeout(() => {
            if (window.getHeroImages && window.renderHero && window.renderCategories) {
              resolve();
            } else {
              resolve();
            }
          }, 2000);
        }
      });
    }
    
    document.addEventListener('DOMContentLoaded', function() {
      waitForHomeModules().then(() => {
        renderShowcase();
        
        const shouldScrollToHero = document.referrer.includes('index.html') || window.location.hash === '#hero';
        if (shouldScrollToHero) {
          setTimeout(() => {
            const heroSection = document.getElementById('hero-section');
            if (heroSection) {
              heroSection.scrollIntoView({ behavior: 'smooth', block: 'center' });
              if (window.location.hash === '#hero') {
                history.replaceState(null, '', window.location.pathname);
              }
            }
          }, 300);
        }
        
        setTimeout(() => {
          const scrollIndicator = document.getElementById('scroll-indicator');
          if (scrollIndicator) {
            scrollIndicator.style.opacity = '0';
            setTimeout(() => {
              scrollIndicator.style.display = 'none';
            }, 500);
          }
        }, 5000);
      });
    });
  </script>

  <script src="../js/fade_in.js"></script>
  <script src="../js/components/menu.js"></script>
  <script src="../js/scroll-to-top.js"></script>
</body>

</html>
