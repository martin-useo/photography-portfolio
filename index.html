    function revealBody() {
      const style = document.getElementById('i18n-preload');
      if (style) style.remove();
      if (document.body) document.body.style.visibility = '';

    if (document.readyState === 'loading') {

        if (typeof LanguageManager !== 'undefined') {
          LanguageManager.applyLanguage();

      });
    } else {

    <script type="module">
      import { MOBILE_LAYOUTS, DESKTOP_LAYOUTS, getRandomLayout, organizeImagesForLayout, createLayoutStructure } from './js/pages/index/layout-handler.js';
      window.MOBILE_LAYOUTS = MOBILE_LAYOUTS;
      window.DESKTOP_LAYOUTS = DESKTOP_LAYOUTS;
      window.getRandomLayout = getRandomLayout;
      window.organizeImagesForLayout = organizeImagesForLayout;
      window.createLayoutStructure = createLayoutStructure;
      
      // Attendre que les modules soient chargés avant d'exécuter le script principal
      window.layoutModulesLoaded = true;
      if (window.onLayoutModulesLoaded) {
        window.onLayoutModulesLoaded();
      }
    </script>
    <script>
    // Fonction de chargement direct des images display pour la page d'accueil
    function loadThumbnailForCanvas(img) {
      if (!img.dataset.filename) return;
      if (img.dataset.loaded === 'true') return;
      
      const filename = img.dataset.filename;
      const basePath = '';
      
      const ext = filename.match(/\.[^.]+$/)?.[0] || '.jpg';
      const baseName = filename.replace(ext, '');
      
      // WebP uniquement (support 97%+ navigateurs)
      const displayUrl = `${basePath}assets/images-optimized/${baseName}-display.webp`;
      
      const displayImg = new Image();
      displayImg.onload = () => {
        img.src = displayUrl;
        img.style.opacity = '1';
        img.dataset.loaded = 'true';
      };
      
      displayImg.onerror = () => {
          img.style.opacity = '0';
      };
      
      displayImg.src = displayUrl;
    }
    </script>
    <script>
    let MOBILE_LAYOUTS = [];
    let DESKTOP_LAYOUTS = [];

    function preloadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error(`Failed to load image: ${src}`));
        img.src = src;
      });
    }

    function isMobile() {
      return window.isMobile ? window.isMobile() : window.innerWidth < 768;
    }

    // Utiliser directement window.getRandomLayout
    function organizeImagesForLayout(layout, portraitImages, landscapeImages) {
      if (!layout || !portraitImages || !landscapeImages) return [];
      if (window.organizeImagesForLayout) {
        if (typeof window.organizeImagesForLayout !== 'function') return [];
        try {
          return window.organizeImagesForLayout(layout, portraitImages, landscapeImages);
        } catch (error) {
          return [];
        }
      }
      return [];
    }

    let cachedImages = null;
    let cachedPortraitImages = null;
    let cachedLandscapeImages = null;
    let currentLayout = null;
    let currentImageIndices = [];
    let cycleInterval = null;
    let lastChangedCell = -1;
    let isCurrentlyMobile = null;
    
    function createLayoutStructure(layout, organizedImages) {
      if (window.createLayoutStructure) {
        return window.createLayoutStructure(layout, organizedImages, loadThumbnailForCanvas);
      }
    }
    
    function changeImageInCell(cellIndex, newImage) {
      const grid = document.getElementById('portfolio-grid');
      if (!grid) return;
      
      const cellContainer = grid.querySelector(`[data-cell-index="${cellIndex}"]`);
      if (!cellContainer) return;
      
      const imageStack = cellContainer.querySelector('div');
      if (!imageStack) return;
      
      const oldImg = imageStack.querySelector('img:not(:last-child)');
      
      const newImgElement = document.createElement('img');
      newImgElement.dataset.src = newImage.src;
      newImgElement.dataset.filename = newImage.filename || newImage.src.split('/').pop();
      newImgElement.alt = newImage.alt || 'Portfolio image';
      newImgElement.className = 'block h-full w-full object-cover object-center opacity-0 transition-opacity duration-700 ease-in-out absolute inset-0';
      newImgElement.dataset.imageIndex = cellIndex;
      
      imageStack.appendChild(newImgElement);
      
      // Charger thumbnail directement
      loadThumbnailForCanvas(newImgElement);
      
      // Crossfade avec l'ancienne image
      if (oldImg) {
        oldImg.style.transition = 'opacity 700ms ease-in-out';
        oldImg.style.opacity = '0';
        
        setTimeout(() => {
          oldImg.remove();
        }, 700);
      }
    }
    
    async function renderBackgroundCanvas(useTransition = false) {
      try {
        const grid = document.getElementById('portfolio-grid');
        if (!grid) return;
        
        if (typeof IMAGES_CONFIG === 'undefined') {
          throw new Error('IMAGES_CONFIG is not defined');
        }
        
        if (!cachedImages) {
          cachedImages = IMAGES_CONFIG.getAllImages('./');
          
          if (!cachedImages || cachedImages.length === 0) {
            throw new Error('No images found in IMAGES_CONFIG');
          }
          
          cachedPortraitImages = cachedImages.filter(img => {
            const ar = img.aspectRatio;
            if (ar === undefined || ar === null || isNaN(ar)) {
              return false;
            }
            return ar < 1;
          });
          cachedLandscapeImages = cachedImages.filter(img => {
            const ar = img.aspectRatio;
            if (ar === undefined || ar === null || isNaN(ar)) {
              return false;
            }
            return ar > 1;
          });
        }
        
        if (useTransition) {
          grid.style.opacity = '0';
          grid.style.transition = 'opacity 0.5s ease-in-out';
          await new Promise(resolve => setTimeout(resolve, 500));
        }
        
        grid.innerHTML = '';
        
        const selectedLayout = window.getRandomLayout ? window.getRandomLayout() : null;
        if (!selectedLayout) {
          throw new Error('No layout available');
        }
        
        const organizedImages = organizeImagesForLayout(selectedLayout, cachedPortraitImages, cachedLandscapeImages);
        
        if (!organizedImages || organizedImages.length === 0) {
          throw new Error('No images organized for layout');
        }
        
        currentLayout = selectedLayout;
        isCurrentlyMobile = isMobile();
        currentImageIndices = organizedImages.map((img, idx) => 
          cachedImages.findIndex(ai => ai.src === img.src)
        );
        
        lastChangedCell = -1;
        if (window.createLayoutStructure) {
          window.createLayoutStructure(selectedLayout, organizedImages, loadThumbnailForCanvas);
        } else {
          throw new Error('createLayoutStructure function not available');
        }
      } catch (error) {
        const grid = document.getElementById('portfolio-grid');
        if (grid) {
          grid.innerHTML = `<div class="w-full h-full bg-gray-800 flex items-center justify-center text-white">Erreur de chargement des images: ${error.message}</div>`;
        }
      }
    }
    
    function cycleNextImage() {
      if (!currentLayout || !cachedImages || currentImageIndices.length === 0) {
        return;
      }
      
      let availableCells = [];
      for (let i = 0; i < currentImageIndices.length; i++) {
        if (i !== lastChangedCell) {
          availableCells.push(i);
        }
      }
      
      if (availableCells.length === 0) {
        availableCells = [0];
      }
      
      const cellIndex = availableCells[Math.floor(Math.random() * availableCells.length)];
      const currentImageIndex = currentImageIndices[cellIndex];
      
      const usedImageIndices = new Set(currentImageIndices);
      let newImage;
      let newImageIndex;
      let attempts = 0;
      const maxAttempts = 200;
      
      let poolToUse;
      if (currentLayout.name === 'mobile-single-portrait') {
        poolToUse = cachedPortraitImages;
      } else if (currentLayout.name === 'mobile-double-landscape') {
        poolToUse = cachedLandscapeImages;
      } else if (currentLayout.name === 'three-column-grid') {
        poolToUse = cachedPortraitImages;
      } else if (currentLayout.name === 'two-left-one-right') {
        if (cellIndex < 2) {
          poolToUse = cachedLandscapeImages;
        } else {
          poolToUse = cachedPortraitImages;
        }
      } else {
        poolToUse = cachedImages;
      }
      
      if (!poolToUse || poolToUse.length === 0) {
        return;
      }
      
      const shuffledPool = [...poolToUse].sort(() => Math.random() - 0.5);
      
      do {
        newImage = shuffledPool[attempts % shuffledPool.length];
        newImageIndex = cachedImages.findIndex(img => img.src === newImage.src);
        attempts++;
      } while ((newImageIndex === currentImageIndex || newImageIndex === -1 || usedImageIndices.has(newImageIndex)) && attempts < maxAttempts);
      
      if (attempts >= maxAttempts || newImageIndex === -1) {
        newImage = shuffledPool[0];
        newImageIndex = cachedImages.findIndex(img => img.src === newImage.src);
        if (newImageIndex === -1) {
          return;
        }
      }
      
      currentImageIndices[cellIndex] = newImageIndex;
      lastChangedCell = cellIndex;
      
      changeImageInCell(cellIndex, newImage);
    }
    
    function startProgressiveCycle() {
      if (cycleInterval) {
        clearInterval(cycleInterval);
      }
      
      cycleInterval = setInterval(() => {
        cycleNextImage();
      }, 2500);
    }
    
    function startAutoCycle() {
      startProgressiveCycle();
    }
    
    let currentLanguage = 'fr';
    let languageInterval = null;
    
    function cycleLanguage() {
      const buttonTextFr = document.getElementById('button-text-fr');
      const buttonTextEn = document.getElementById('button-text-en');
      
      if (!buttonTextFr || !buttonTextEn) return;
      
      if (currentLanguage === 'fr') {
        requestAnimationFrame(() => {
          buttonTextEn.style.opacity = '1';
          setTimeout(() => {
            requestAnimationFrame(() => {
              buttonTextFr.style.opacity = '0';
            });
          }, 150);
        });
        currentLanguage = 'en';
      } else {
        requestAnimationFrame(() => {
          buttonTextFr.style.opacity = '1';
          setTimeout(() => {
            requestAnimationFrame(() => {
              buttonTextEn.style.opacity = '0';
            });
          }, 150);
        });
        currentLanguage = 'fr';
      }
    }
    
    function startLanguageCycle() {
      if (languageInterval) {
        clearInterval(languageInterval);
      }
      
      const initialDelay = 3000 + Math.random() * 4000;
      
      setTimeout(() => {
        cycleLanguage();
        languageInterval = setInterval(() => {
          cycleLanguage();
        }, 4700);
      }, initialDelay);
    }
    
    let resizeTimeout;
    function handleResize() {
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(() => {
        const newIsMobile = isMobile();
        if (isCurrentlyMobile !== null && newIsMobile !== isCurrentlyMobile) {
          isCurrentlyMobile = newIsMobile;
          renderBackgroundCanvas(true);
        }
      }, 250);
    }

    window.addEventListener('resize', handleResize);
    
    function waitForImagesConfig() {
      return new Promise((resolve) => {
        if (typeof IMAGES_CONFIG !== 'undefined') {
          resolve();
        } else {
          let attempts = 0;
          const checkInterval = setInterval(() => {
            attempts++;
            if (typeof IMAGES_CONFIG !== 'undefined') {
              clearInterval(checkInterval);
              resolve();
            } else if (attempts > 50) {
              clearInterval(checkInterval);
              resolve();
            }
          }, 100);
        }
      });
    }
    
    function waitForLayoutModules() {
      return new Promise((resolve) => {
        if (window.layoutModulesLoaded && window.getRandomLayout && window.organizeImagesForLayout && window.createLayoutStructure) {
          resolve();
        } else {
          window.onLayoutModulesLoaded = resolve;
          setTimeout(() => {
            if (window.getRandomLayout && window.organizeImagesForLayout && window.createLayoutStructure) {
              resolve();
            } else {
              resolve();
            }
          }, 1000);
        }
      });
    }
    
    function initPage() {
      Promise.all([waitForImagesConfig(), waitForLayoutModules()]).then(() => {
        if (typeof IMAGES_CONFIG === 'undefined') {
          const grid = document.getElementById('portfolio-grid');
          if (grid) {
            grid.innerHTML = '<div class="w-full h-full bg-gray-800 flex items-center justify-center text-white">Erreur: IMAGES_CONFIG non chargé</div>';
          }
          return;
        }
        
        renderBackgroundCanvas().then(() => {
          startAutoCycle();
          startLanguageCycle();
        }).catch((error) => {
          const grid = document.getElementById('portfolio-grid');
          if (grid) {
            grid.innerHTML = `<div class="w-full h-full bg-gray-800 flex items-center justify-center text-white">Erreur: ${error.message}</div>`;
          }
        });
      });
    }
    
    document.addEventListener('DOMContentLoaded', initPage);
  </script>

  <script src="js/fade_in.js"></script>
